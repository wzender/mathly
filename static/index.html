<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>מתמטיקה בכיף</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon-192.png">
  <style>
    :root{--f-body:system-ui,-apple-system,"Segoe UI",sans-serif;--f-display:var(--f-body)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#f4f2ec;font-family:var(--f-body)}
    #boot{min-height:100vh;display:grid;place-content:center;text-align:center;gap:18px;padding:24px}
    #boot img{width:min(300px,75vw);height:auto;margin:auto}#boot p{color:#9ea7a0;margin:0}
    #loginBtn{border:1px solid #7fa6f0;background:#7fa6f0;color:#06101f;border-radius:999px;padding:12px 20px;font-weight:700;cursor:pointer}
    #loginBtn[hidden]{display:none}.error{color:#f08a96}
  </style>
</head>
<body>
  <main id="boot">
    <img src="/static/logo-math.svg" alt="מתמטיקה בכיף" width="489" height="225">
    <p id="bootState">טוענים את מסלול המתמטיקה…</p>
    <button id="loginBtn" hidden>כניסה עם Google</button>
  </main>
  <script>window.MATHLY={supabaseUrl:"__SUPABASE_URL__",supabaseKey:"__SUPABASE_KEY__",token:"",email:"",classes:[],permissions:[]};</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/static/math.js"></script>
</body>
</html>
