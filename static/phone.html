<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>צילום תרגיל למחשב</title>
  <style>
    body{background:#000;color:#f4f2ec;font:18px system-ui;margin:0;padding:28px;line-height:1.6}
    main{max-width:480px;margin:40px auto}button{font:inherit;background:#7fa6f0;border:0;border-radius:24px;padding:12px 24px;cursor:pointer}
    button:disabled{opacity:.5}img{display:block;max-width:100%;max-height:300px;margin:20px auto;border-radius:12px}
    [hidden]{display:none}#status{white-space:pre-wrap}
  </style>
</head>
<body><main>
  <h1>צילום תרגיל למחשב</h1>
  <p>צלמו את כל התרגיל, כולל השרטוט והנתונים. הפתרון יופיע במחשב שבו פתחתם את הקישור.</p>
  <input id="camera" type="file" accept="image/*" capture="environment" hidden>
  <button id="take" type="button">צילום תרגיל</button>
  <img id="preview" alt="התרגיל שצילמתם" hidden>
  <button id="send" type="button" hidden>שליחה למחשב</button>
  <p id="status" role="status" aria-live="polite"></p>
</main><script src="/static/photo-image.js"></script><script src="/static/phone.js"></script></body>
</html>
